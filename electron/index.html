<!DOCTYPE html>
<html>
<head>
  <title>Gestión de Finanzas</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; margin: 0; }
    .container { max-width: 800px; margin: 0 auto; background: white; color: #333; padding: 30px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); position: relative; z-index: 1; }
    h1 { color: white; text-align: center; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); display: inline-block; padding: 10px 30px; border-radius: 10px; margin: 0 auto 20px; }
    .title-container { text-align: center; margin-bottom: 20px; }
    .card { background: #f8f9fa; padding: 20px; border-radius: 8px; margin: 20px 0; position: relative; z-index: 2; }
    .btn { background: #667eea; color: white; padding: 10px 20px; border: none; border-radius: 5px; cursor: pointer; margin: 5px; }
    .btn:hover { background: #5568d3; }
    input, select { width: 100%; padding: 10px; margin: 5px 0; border: 1px solid #ddd; border-radius: 5px; box-sizing: border-box; position: relative; z-index: 3; }
    .tx-item { margin-bottom: 10px; padding: 10px; background: #f0f0f0; border-radius: 5px; }
    .income { color: #28a745; }
    .expense { color: #dc3545; }
    
    /* Balance cards */
    .balance-cards {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 15px;
      margin-bottom: 20px;
    }
    .balance-card {
      background: #f8f9fa;
      padding: 20px;
      border-radius: 10px;
      text-align: center;
      position: relative;
      overflow: hidden;
    }
    .balance-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 5px;
    }
    .balance-card.income::before {
      background: #28a745;
    }
    .balance-card.expense::before {
      background: #dc3545;
    }
    .balance-card.balance::before {
      background: #667eea;
    }
    .balance-card.balance.positive::before {
      background: #28a745;
    }
    .balance-card.balance.negative::before {
      background: #dc3545;
    }
    .balance-card h3 {
      margin: 0 0 10px;
      font-size: 14px;
      color: #666;
      text-transform: uppercase;
    }
    .balance-card .amount {
      font-size: 24px;
      font-weight: bold;
      color: #333;
    }
    .balance-card.income .amount {
      color: #28a745;
    }
    .balance-card.expense .amount {
      color: #dc3545;
    }
    .balance-card.balance.positive .amount {
      color: #28a745;
    }
    .balance-card.balance.negative .amount {
      color: #dc3545;
    }
    
    /* Theme-specific balance cards */
    body.theme-dark .balance-card {
      background: #3d3d3d;
    }
    body.theme-dark .balance-card h3 {
      color: #aaa;
    }
    body.theme-dark .balance-card .amount {
      color: #fff;
    }
    body.theme-dark .balance-card.income .amount {
      color: #28a745;
    }
    body.theme-dark .balance-card.expense .amount {
      color: #dc3545;
    }
    body.theme-dark .balance-card.balance.positive .amount {
      color: #28a745;
    }
    body.theme-dark .balance-card.balance.negative .amount {
      color: #dc3545;
    }
    
    /* Modal styles */
    #modal { 
      display: none; 
      position: fixed; 
      top: 0; 
      left: 0; 
      width: 100%; 
      height: 100%; 
      background: rgba(0,0,0,0.5); 
      z-index: 1000; 
      align-items: center; 
      justify-content: center; 
    }
    #modal > div {
      background: white; 
      padding: 30px; 
      border-radius: 10px; 
      max-width: 400px; 
      text-align: center;
      color: #333;
    }
    #modalTitle {
      color: #667eea;
      margin-top: 0;
    }
    #modalMessage {
      color: #333;
      margin: 15px 0;
    }
    
    /* Theme selector */
    .theme-selector {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
      justify-content: center;
    }
    .theme-btn {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: 3px solid #ddd;
      cursor: pointer;
      transition: transform 0.2s;
    }
    .theme-btn:hover {
      transform: scale(1.1);
    }
    .theme-btn.active {
      border-color: #667eea;
      box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.3);
    }
    
    /* Themes */
    body.theme-purple {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    }
    body.theme-purple .container h1,
    body.theme-purple .btn {
      background: #667eea;
    }
    body.theme-purple h1 {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    }
    
    body.theme-blue {
      background: linear-gradient(135deg, #2193b0 0%, #6dd5ed 100%);
    }
    body.theme-blue .btn {
      background: #2193b0;
    }
    body.theme-blue h1 {
      background: linear-gradient(135deg, #2193b0 0%, #6dd5ed 100%);
    }
    body.theme-blue #modalTitle {
      color: #2193b0;
    }
    
    body.theme-green {
      background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
    }
    body.theme-green .btn {
      background: #11998e;
    }
    body.theme-green h1 {
      background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
    }
    body.theme-green #modalTitle {
      color: #11998e;
    }
    
    body.theme-dark {
      background: linear-gradient(135deg, #232526 0%, #414345 100%);
    }
    body.theme-dark .container {
      background: #2d2d2d;
      color: #fff;
    }
    body.theme-dark .card {
      background: #3d3d3d;
      color: #fff;
    }
    body.theme-dark #rulesList > div {
      background: #4d4d4d !important;
      color: #fff;
    }
    body.theme-dark .tx-item {
      background: #4d4d4d;
      color: #fff;
    }
    body.theme-dark .btn {
      background: #4a4a4a;
    }
    body.theme-dark h1 {
      color: #fff;
      background: linear-gradient(135deg, #232526 0%, #414345 100%);
    }
    body.theme-dark input,
    body.theme-dark select {
      background: #4d4d4d;
      color: #fff;
      border-color: #666;
    }
    body.theme-dark #modal > div {
      background: #2d2d2d;
      color: #fff;
    }
    body.theme-dark #modalTitle {
      color: #667eea;
    }
    body.theme-dark #modalMessage {
      color: #fff;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="title-container">
      <h1>💰 Gestión de Finanzas</h1>
    </div>
    
    <div class="theme-selector">
      <button class="theme-btn active" data-theme="purple" style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);" title="Púrpura"></button>
      <button class="theme-btn" data-theme="blue" style="background: linear-gradient(135deg, #2193b0 0%, #6dd5ed 100%);" title="Azul"></button>
      <button class="theme-btn" data-theme="green" style="background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);" title="Verde"></button>
      <button class="theme-btn" data-theme="dark" style="background: linear-gradient(135deg, #232526 0%, #414345 100%);" title="Oscuro"></button>
    </div>
    
    <div class="card">
      <h2>📊 Balance Actual</h2>
      <div class="balance-cards">
        <div class="balance-card income">
          <h3>Ingresos</h3>
          <div class="amount" id="incomeAmount">Cargando...</div>
        </div>
        <div class="balance-card expense">
          <h3>Gastos</h3>
          <div class="amount" id="expenseAmount">Cargando...</div>
        </div>
        <div class="balance-card balance" id="balanceCard">
          <h3>Balance</h3>
          <div class="amount" id="balanceAmount">Cargando...</div>
        </div>
      </div>
    </div>
    
    <div class="card">
      <h2>➕ Agregar Transacción</h2>
      <select id="txType">
        <option value="income">Ingreso</option>
        <option value="expense">Gasto</option>
      </select>
      <input type="number" id="txAmount" placeholder="Monto" step="0.01" />
      <input type="text" id="txCategory" placeholder="Categoría" />
      <input type="text" id="txDescription" placeholder="Descripción" />
      <button class="btn" id="addTxBtn">Agregar</button>
    </div>
    
    <div class="card">
      <h2>⚙️ Reglas Automáticas</h2>
      <button class="btn" id="newRuleBtn">Nueva Regla</button>
      <div id="ruleForm" style="display: none; margin-top: 15px; padding: 15px; background: #f0f0f0; border-radius: 5px;">
        <select id="ruleType">
          <option value="income">Ingreso Recurrente</option>
          <option value="expense">Gasto Recurrente</option>
        </select>
        <select id="ruleFrequency">
          <option value="monthly">Mensual</option>
          <option value="weekly">Semanal</option>
        </select>
        <input type="number" id="ruleAmount" placeholder="Monto" step="0.01" />
        <input type="text" id="ruleCategory" placeholder="Categoría" />
        <input type="text" id="ruleDescription" placeholder="Descripción" />
        <div id="dayOfWeekContainer" style="display: none;">
          <label>Día de la semana - 0 es Domingo, 6 es Sábado:</label>
          <select id="ruleDayOfWeek">
            <option value="0">Domingo</option>
            <option value="1">Lunes</option>
            <option value="2">Martes</option>
            <option value="3">Miércoles</option>
            <option value="4">Jueves</option>
            <option value="5">Viernes</option>
            <option value="6">Sábado</option>
          </select>
        </div>
        <div id="dayOfMonthContainer" style="display: none;">
          <label>Día del mes (1-31):</label>
          <input type="number" id="ruleDayOfMonth" min="1" max="31" />
        </div>
        <button class="btn" id="createRuleBtn">Crear Regla</button>
        <button class="btn" id="cancelRuleBtn" style="background: #6c757d;">Cancelar</button>
      </div>
      <button class="btn" id="executeRulesBtn" style="background: #17a2b8; margin-top: 10px;">⚡ Ejecutar Reglas Pendientes</button>
      <div id="rulesList" style="margin-top: 15px;">Cargando reglas...</div>
    </div>
    
    <div class="card">
      <h2>📋 Transacciones</h2>
      <div id="txList">Cargando...</div>
    </div>
  </div>
  
  <!-- Modal para mensajes -->
  <div id="modal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1000; align-items: center; justify-content: center;">
    <div style="background: white; padding: 30px; border-radius: 10px; max-width: 400px; text-align: center;">
      <h3 id="modalTitle">Mensaje</h3>
      <p id="modalMessage">Texto del mensaje</p>
      <button class="btn" id="modalCloseBtn">Cerrar</button>
    </div>
  </div>
  
  <script src="app.js"></script>
</body>
</html>
